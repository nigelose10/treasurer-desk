name: e2e

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  switch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Demo flow against Switch 0.31.0
        run: make demo
      - name: Upload transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: treasurer-desk-transcript
          path: |
            demo/transcript.md
            demo/metrics.json
          if-no-files-found: ignore
