[project]
name = "treasurer-desk"
version = "1.0.0"
description = "A club-finance room where three Switch agents and a human treasurer clear reimbursements."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27.2",
  "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.6.0",
]
demo = [
  "playwright>=1.48.0",
  "pillow>=10.4.0",
]

[project.scripts]
treasurer-desk = "desk.runner:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "e2e: needs the self-hosted Switch stack and a running desk",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["desk*"]
